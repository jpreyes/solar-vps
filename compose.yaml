services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: solar
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - solar_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U solar -d solar]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - 127.0.0.1:8088:8000
    depends_on:
      db:
        condition: service_healthy
  collector:
    build: .
    restart: unless-stopped
    command: [python, collector.py]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
  weather:
    build: .
    restart: unless-stopped
    command: [python, weather.py]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  solar_data:
